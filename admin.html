<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Rolling | Full Admin Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #f59e0b;
            --accent-green: #10b981;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --text-dark: #0f172a;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 3px solid var(--accent);
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            color: var(--secondary);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .btn-action {
            background: var(--accent);
            color: #0f172a;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-action:hover { opacity: 0.9; }

        .btn-danger {
            background: var(--danger);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .team-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .status-msg {
            margin-top: 0.5rem;
            font-weight: 700;
            color: var(--accent-green);
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }

        @media (max-width: 600px) {
            .grid-2, .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎛️ Master Admin Controller</h1>
        <p>Manage Teams, Live Game Scores & Tournament Settings</p>
    </header>

    <div class="container">

        <!-- LIVE SCORE CONTROL PANEL -->
        <div class="card">
            <h2>🕹️ Live Game Score Controller</h2>
            <div class="form-group">
                <label>Select Mat to Update</label>
                <select id="score-mat-select" onchange="loadSelectedMatData()">
                    <option value="1">Mat 1 (Main Court)</option>
                    <option value="2">Mat 2</option>
                    <option value="3">Mat 3</option>
                    <option value="4">Mat 4</option>
                </select>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>Player / Team A Name</label>
                    <input type="text" id="admin-p1-name" value="Player A">
                </div>
                <div class="form-group">
                    <label>Player / Team B Name</label>
                    <input type="text" id="admin-p2-name" value="Player B">
                </div>
                <div class="form-group">
                    <label>Player A Score</label>
                    <input type="number" id="admin-p1-score" value="0">
                </div>
                <div class="form-group">
                    <label>Player B Score</label>
                    <input type="number" id="admin-p2-score" value="0">
                </div>
                <div class="form-group">
                    <label>Quarter / Stage</label>
                    <input type="text" id="admin-qtr" value="Quarter 1">
                </div>
                <div class="form-group">
                    <label>Timer Display (MM:SS)</label>
                    <input type="text" id="admin-timer" value="02:00">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Match Status</label>
                    <select id="admin-status">
                        <option value="LIVE">LIVE</option>
                        <option value="PAUSED">PAUSED</option>
                        <option value="FINAL">FINAL</option>
                    </select>
                </div>
            </div>
            <button class="btn-action" onclick="broadcastLiveScore()">Broadcast Live Game Update</button>
            <div class="status-msg" id="msg-score">✓ Game score updated and broadcasted!</div>
        </div>

        <!-- TEAM MANAGEMENT (ADD / REMOVE TEAMS) -->
        <div class="card">
            <h2>🛡️ Manage Teams & Lineups</h2>
            
            <!-- Add New Team Form -->
            <div style="background: #fafafa; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 1rem;">
                <h3 style="font-size: 1rem; margin-bottom: 0.5rem; font-family: 'Montserrat';">Add New Team</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Team Name</label>
                        <input type="text" id="new-team-name" placeholder="e.g. Rail Strikers">
                    </div>
                    <div class="form-group">
                        <label>Badge Color</label>
                        <select id="new-team-color">
                            <option value="bg-red">Red</option>
                            <option value="bg-blue">Blue</option>
                            <option value="bg-green">Green</option>
                            <option value="bg-yellow">Yellow</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Roster Players (comma separated)</label>
                        <input type="text" id="new-team-roster" placeholder="Player A (Captain), J. Miller, C. Vance">
                    </div>
                </div>
                <button class="btn-action" style="background: var(--primary); color: white;" onclick="addTeam()">+ Add Team to Portal</button>
            </div>

            <!-- Existing Teams List -->
            <h3 style="font-size: 1rem; margin-bottom: 0.5rem; font-family: 'Montserrat';">Current Tournament Teams</h3>
            <div id="teams-list-container">
                <!-- Dynamically populated -->
            </div>
            <div class="status-msg" id="msg-teams">✓ Teams list updated!</div>
        </div>

        <!-- BRACKET CONTROLLER -->
        <div class="card">
            <h2>🏆 Championship Bracket Settings</h2>
            <div class="grid-2">
                <div class="form-group">
                    <label>Finals Matchup - Team 1</label>
                    <input type="text" id="bracket-f1" value="Rail Strikers">
                </div>
                <div class="form-group">
                    <label>Finals Matchup - Team 2</label>
                    <input type="text" id="bracket-f2" value="Stone Launchers">
                </div>
            </div>
            <button class="btn-action" onclick="saveBracket()">Update Bracket Display</button>
            <div class="status-msg" id="msg-bracket">✓ Bracket updated!</div>
        </div>

    </div>

    <script>
        // Default initial teams
        let teams = [
            { id: 1, name: "Rail Strikers", color: "bg-red", seed: "Seed #1", roster: ["Player A (Captain)", "J. Miller", "C. Vance"] },
            { id: 2, name: "Stone Launchers", color: "bg-blue", seed: "Seed #2", roster: ["Player B (Captain)", "R. Chen", "A. Davis"] },
            { id: 3, name: "Iron Trackers", color: "bg-green", seed: "Seed #3", roster: ["T. Oakley", "K. Kowalski", "M. Garcia"] }
        ];

        function showNotification(id) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        // LOAD & RENDER TEAMS
        function renderTeams() {
            const container = document.getElementById('teams-list-container');
            container.innerHTML = '';
            
            teams.forEach((t, index) => {
                const item = document.createElement('div');
                item.className = 'team-item';
                item.innerHTML = `
                    <div>
                        <strong>${t.name}</strong> (${t.roster.length} Players)
                        <div style="font-size: 0.8rem; color: #64748b;">${t.roster.join(', ')}</div>
                    </div>
                    <button class="btn-danger" onclick="removeTeam(${index})">Remove</button>
                `;
                container.appendChild(item);
            });

            // Save to localStorage
            localStorage.setItem('railway_portal_teams', JSON.stringify(teams));
        }

        function addTeam() {
            const name = document.getElementById('new-team-name').value.trim();
            const color = document.getElementById('new-team-color').value;
            const rosterRaw = document.getElementById('new-team-roster').value.trim();

            if (!name) { alert("Please enter a team name."); return; }

            const roster = rosterRaw ? rosterRaw.split(',').map(s => s.trim()) : ["Player 1"];

            teams.push({
                id: Date.now(),
                name: name,
                color: color,
                seed: `Seed #${teams.length + 1}`,
                roster: roster
            });

            document.getElementById('new-team-name').value = '';
            document.getElementById('new-team-roster').value = '';

            renderTeams();
            showNotification('msg-teams');
        }

        function removeTeam(index) {
            if (confirm(`Remove ${teams[index].name} from the tournament?`)) {
                teams.splice(index, 1);
                renderTeams();
                showNotification('msg-teams');
            }
        }

        // GAME SCORE CONTROLLER LOGIC
        function broadcastLiveScore() {
            const matId = document.getElementById('score-mat-select').value;
            
            // Format time string to total seconds for timer displays
            const timeParts = document.getElementById('admin-timer').value.split(':');
            let totalSeconds = 120;
            if (timeParts.length === 2) {
                totalSeconds = (parseInt(timeParts[0]) * 60) + parseInt(timeParts[1]);
            }

            const gameData = {
                playerA: document.getElementById('admin-p1-name').value,
                playerB: document.getElementById('admin-p2-name').value,
                scoreA: parseInt(document.getElementById('admin-p1-score').value) || 0,
                scoreB: parseInt(document.getElementById('admin-p2-score').value) || 0,
                quarter: document.getElementById('admin-qtr').value,
                timeLeft: totalSeconds,
                status: document.getElementById('admin-status').value
            };

            // Broadcast to key used by portal.html and dashboard.html
            localStorage.setItem(`railway_mat${matId}_data`, JSON.stringify(gameData));
            showNotification('msg-score');
        }

        function loadSelectedMatData() {
            const matId = document.getElementById('score-mat-select').value;
            const raw = localStorage.getItem(`railway_mat${matId}_data`);
            if (raw) {
                const data = JSON.parse(raw);
                document.getElementById('admin-p1-name').value = data.playerA || "Player A";
                document.getElementById('admin-p2-name').value = data.playerB || "Player B";
                document.getElementById('admin-p1-score').value = data.scoreA || 0;
                document.getElementById('admin-p2-score').value = data.scoreB || 0;
                document.getElementById('admin-qtr').value = data.quarter || "Quarter 1";
                document.getElementById('admin-status').value = data.status || "LIVE";

                let mins = Math.floor((data.timeLeft || 120) / 60);
                let secs = (data.timeLeft || 120) % 60;
                document.getElementById('admin-timer').value = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }

        // BRACKET CONTROLLER
        function saveBracket() {
            const data = {
                sf1: document.getElementById('bracket-f1').value,
                sf2: document.getElementById('bracket-f2').value
            };
            localStorage.setItem('railway_portal_bracket', JSON.stringify(data));
            showNotification('msg-bracket');
        }

        // Initialize saved state on page load
        const savedTeams = localStorage.getItem('railway_portal_teams');
        if (savedTeams) {
            try { teams = JSON.parse(savedTeams); } catch(e){}
        }
        renderTeams();
        loadSelectedMatData();
    </script>
</body>
</html>
